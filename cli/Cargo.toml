[package]
name = "charity-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "charity-cli"
path = "src/main.rs"

[dependencies]
solana-charity-donations = { path = "../programs/solana-charity-donations", features = ["no-entrypoint"] }
anchor-client = "0.32.1"
solana-system-interface = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
